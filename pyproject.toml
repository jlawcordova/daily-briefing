[project]
name = "daily-briefing"
version = "0.1.0"
description = "Configurable daily briefing: news, podcasts, articles, forums, and a local food feature, enriched by Claude."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "feedparser>=6.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "trafilatura>=1.12",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_briefing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real network/APIs (run manually)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
